[package]
name = "fn-chest-counter"
version = "0.1.1"
description = "Numără automat cuferele deschise în Fortnite, citind doar imaginea și sunetul de pe ecran."
authors = ["asygames"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "fn_chest_counter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
rustfft = "6.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
log = "0.4"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"
cpal = "0.18.2"
windows = { version = "0.62", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_XboxController",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_System_WinRT",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Security_Cryptography",
  "Storage_Streams",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
