name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Dependențe npm
        run: npm ci

      - name: Verificare interfață (svelte-check)
        run: npm run check

      - name: Teste nucleu de detecție
        working-directory: src-tauri
        run: cargo test --lib

      - name: Clippy (Windows)
        working-directory: src-tauri
        run: cargo clippy --lib -- -D warnings

      - name: Build installer
        run: npm run tauri -- build

      - name: Pregătește fișierele
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/fn-chest-counter.exe "out/FN Chest Counter (portabil).exe"
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: FNChestCounter-windows
          path: out/*
          if-no-files-found: error

      - name: Release (doar pe tag-uri v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: out/*
          draft: true
